name: Nova Engine Run

on:
  push:
    branches: [main]
  workflow_dispatch:  # optional manual trigger

jobs:
  run-nova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Nova engine
        run: python nova.py main.nova > output.log

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4   # <-- v4 update
        with:
          name: nova-output
          path: output.log
