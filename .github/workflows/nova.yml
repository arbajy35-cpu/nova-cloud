name: Nova Engine Run

on:
  push:
    branches: [main]
  workflow_dispatch:  # optional manual trigger

jobs:
  run-nova:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Nova engine
        run: python nova.py main.nova
